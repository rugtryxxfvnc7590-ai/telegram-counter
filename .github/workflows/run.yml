name: Telegram Counter Bot
on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；每 15 分钟的间隔不受时区影响。
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 状态会提交回仓库，禁止两次运行同时读写同一个 offset/count。
concurrency:
  group: telegram-counter-bot
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 验证北京时间跨日边界
        run: python -m unittest -v

      - name: 运行机器人
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_GROUP1: ${{ secrets.TELEGRAM_CHAT_ID_GROUP1 }}
          TELEGRAM_CHAT_ID_GROUP3: ${{ secrets.TELEGRAM_CHAT_ID_GROUP3 }}
        run: python main.py

      - name: 用 Telegram 用户会话补齐今日群消息
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: python sync_group_messages.py

      - name: 同步已删除的群消息
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: python sync_deleted_messages.py

      - name: 发送19:00逐群私信名单
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: python send_daily_lists.py

      - name: 提交状态更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json link_registry.json
          git status
          if git diff --staged --quiet; then
            echo "state.json / link_registry.json 无变化，跳过提交"
          else
            git commit -m "Update bot state and link registry [skip ci]"
            git push origin HEAD:main
            echo "✅ state.json 已提交"
          fi
